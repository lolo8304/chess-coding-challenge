<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8"/>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Coding challenge - Chess</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: #1b1b1b;
        }

        button {
            -webkit-tap-highlight-color: transparent; /* Prevent tap highlight color */
            font-size: 16px; /* Use at least 16px to prevent zooming on focus */
            padding: 10px;
        }

        select {
            font-size: 16px;
            padding: 10px;
        }

        .control-row {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
        }

        .primary-control-row,
        .mode-control-row {
            align-items: center;
            display: flex;
            gap: 8px;
        }

        .mode-control-row {
            gap: 4px;
        }

        canvas {
            display: block;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
            /* mobile webkit */
        }

        .full-width-input {
            width: 100%; /* Makes the input take up 100% of its parent's width */
            box-sizing: border-box; /* Includes padding and border in the element's width */
            font-size: large;
            font-family: 'Arial', sans-serif;
            margin-bottom: 10px;
        }

        .body {
            color: white;
            align-content: center;
            display: flex;
            justify-content: center;
        }

        .main canvas {
            width: 100%;
        }

        .console {
            background-color: #1b1b1b;
            margin-top: -15px;
            margin-left: 5px;
            margin-right: 5px;
            padding: 0;
        }

        .console-header {
            align-items: center;
            background-color: #000;
            display: flex;
            gap: 8px;
            justify-content: space-between;
            padding: 10px 0;
        }

        .console-toggle {
            align-items: center;
            background: transparent;
            border: 1px solid #666;
            color: white;
            cursor: pointer;
            display: inline-flex;
            flex: 0 0 auto;
            height: 42px;
            justify-content: center;
            padding: 0;
            width: 42px;
        }

        .console-toggle svg {
            height: 24px;
            width: 24px;
        }

        .computer-mode-button.active {
            background-color: #d7e6c5;
            border: 2px solid #7f9a63;
        }

        .computer-mode-button[data-mode="ai-vs-ai"] {
            margin-left: 12px;
        }

        .icon-button {
            align-items: center;
            display: inline-flex;
            height: 48px;
            justify-content: center;
            width: 48px;
            padding: 0;
        }

        #aiStrength {
            box-sizing: border-box;
            height: 48px;
            padding: 4px;
            width: 116px;
        }

        .king-icon {
            background-image: url("images/Chess_Pieces_Sprite-large.png");
            background-repeat: no-repeat;
            background-size: 252px 84px;
            display: inline-block;
            height: 42px;
            width: 42px;
        }

        .white-king-icon {
            background-position: 0 0;
        }

        .black-king-icon {
            background-position: 0 -42px;
        }

        .split-king-icon {
            display: inline-block;
            height: 42px;
            position: relative;
            width: 42px;
        }

        .split-king-half {
            height: 42px;
            overflow: hidden;
            position: absolute;
            top: 0;
            width: 21px;
        }

        .split-king-left {
            left: 0;
        }

        .split-king-right {
            left: 21px;
        }

        .split-king-right .king-icon {
            transform: translateX(-21px);
        }

        .mode-icon {
            height: 24px;
            width: 24px;
        }

        .ai-mode-icon {
            height: 34px;
            width: 44px;
        }

        .visually-hidden {
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            height: 1px;
            overflow: hidden;
            position: absolute;
            white-space: nowrap;
            width: 1px;
        }

        .console.collapsed .console-body,
        .console.collapsed .chevron-up,
        .console:not(.collapsed) .chevron-down {
            display: none;
        }

        .console.phase-start .play-controls,
        .console.phase-end .play-controls,
        .console.phase-play .start-controls {
            display: none;
        }

        .console-body {
            padding-top: 10px;
        }

        .fen-row {
            align-items: center;
            display: flex;
            gap: 8px;
        }

        .fen-row .full-width-input {
            flex: 1 1 auto;
            margin-bottom: 0;
            min-width: 0;
        }

        @media (max-width: 640px) {
            .console-header {
                align-items: flex-start;
            }

            .control-row {
                flex: 1 1 auto;
            }

            .primary-control-row,
            .mode-control-row {
                flex-wrap: nowrap;
            }

            .mode-control-row {
                flex-basis: 100%;
                order: 2;
            }
        }
    </style>

    </style>
    <script src="p5.min.js"></script>
    <link rel="icon" href="favicon.ico" sizes="any">
    <script src="chess.js"></script>
    <script src="game.js"></script>
    <script src="board-pieces.js"></script>
    <script src="zobrist-keys.js"></script>
    <script src="zobrist.js"></script>
    <script src="bit-board.js"></script>
    <script src="transposition-table.js"></script>
    <!--script src="alpha-beta.js"></script-->
    <script src="board-data.js"></script>
    <script src="board-moves.js"></script>
    <script src="history.js"></script>
    <script src="board.js"></script>
    <script src="computerplayers.js"></script>
    <script>
        let gamePhase = "start";

        function handleSubmit(event) {
            event.preventDefault();
            const fenValue = document.getElementById('fen').value;
            if (fenValue) {
                window.location.hash = fenValue
                window.location.reload();
            }
        }

        function updateStatus(computer, status) {
            const resultElement = document.getElementById('result');
            if (computer === 'white') {
                status === "ON" ? game.computerWhite.on().checkForAutoTurn() : game.computerWhite.off()
            } else if (computer === 'black') {
                status === "ON" ? game.computerBlack.on().checkForAutoTurn() : game.computerBlack.off()
            }
        }

        function setComputerMode(mode) {
            if (effectiveGamePhase() === "end") {
                startNewGame();
            }

            let selectedMode = mode;
            if (mode === 'random') {
                selectedMode = Math.random() < 0.5 ? 'white' : 'black';
            }

            if (selectedMode === 'white') {
                updateStatus('white', 'OFF');
                updateStatus('black', 'ON');
            } else if (selectedMode === 'black') {
                updateStatus('black', 'OFF');
                updateStatus('white', 'ON');
            } else if (selectedMode === 'human') {
                updateStatus('white', 'OFF');
                updateStatus('black', 'OFF');
            } else if (selectedMode === 'ai-vs-ai') {
                updateStatus('white', 'ON');
                updateStatus('black', 'ON');
            }

            setActiveComputerMode(selectedMode);
            setGamePhase("play");
        }

        function setActiveComputerMode(mode) {
            document.querySelectorAll('.computer-mode-button').forEach(function (button) {
                button.classList.toggle('active', button.dataset.mode === mode);
            });
        }

        function startNewGame() {
            history.replaceState(null, "", window.location.pathname + window.location.search);
            fen_hash = FEN_start;
            resizeFinalize();
            setupFen();
            setActiveComputerMode("white");
            setGamePhase("start");
        }

        function resignGame() {
            if (!game?.board?.data || game.board.data.isFinished()) {
                return;
            }
            if (!window.confirm("Are you sure you want to resign?")) {
                return;
            }
            game.board.data.result = PieceNames[game.color] + " resigned";
            updateConsolePhase();
        }

        function hasUndoMove() {
            return Boolean(game?.board?.data?.history?.lastMoveToUndo?.());
        }

        function effectiveGamePhase() {
            return game?.board?.data?.isFinished?.() ? "end" : gamePhase;
        }

        function updateConsolePhase() {
            const consoleElement = document.querySelector('.console');
            if (!consoleElement) {
                return;
            }

            const phase = effectiveGamePhase();
            consoleElement.classList.toggle('phase-start', phase === "start");
            consoleElement.classList.toggle('phase-play', phase === "play");
            consoleElement.classList.toggle('phase-end', phase === "end");

            const undoButton = document.getElementById('undoButton');
            if (undoButton) {
                undoButton.disabled = !hasUndoMove();
            }
        }

        function setGamePhase(phase) {
            gamePhase = phase;
            updateConsolePhase();
            game?.syncClockToPhase?.();
        }

        function updateAiStrength(name) {
            setAiSearchStrengthPreset(name);
        }

        function updateDebug(checked) {
            verbose = checked ? 1 : 0;
        }

        document.addEventListener('DOMContentLoaded', function () {
            setupFen();
            const aiStrengthElement = document.getElementById('aiStrength');
            if (aiStrengthElement) {
                aiStrengthElement.value = getAiSearchStrengthPreset();
            }
            const debugElement = document.getElementById('debug');
            if (debugElement) {
                debugElement.checked = verbose > 0;
            }
            updateConsolePhase();
        });

        function stats(depth, stat) {
            setTimeout(function stats2() {
                const testMovesResults = document.getElementById('testMovesResults');
                testMovesResults.innerHTML = testMovesResults.innerHTML + "<br>" + depth + ": " + stat
            }, 100);
        }

        function testMovesStart() {
            if (window.location.hostname !== "localhost1") {
                const testMovesElement = document.getElementById('testMovesElem');
                const testMovesResults = document.getElementById('testMovesResults');
                if (!testMovesElement || !testMovesResults) {
                    return;
                }
                testMovesResults.innerHTML = ""
                testMovesElement.setAttribute("style", "display:none");
                setTimeout(function test() {
                    testMoves(stats)
                    testMovesElement.setAttribute("style", "display:")
                }, 100);
            }
        }

        function setupFen() {
            if (window.location.hostname !== "localhost") {
                const testMovesElement = document.getElementById('testMovesElem');
                if (testMovesElement) {
                    testMovesElement.setAttribute("style", "display:")
                }
                const fenLibraryElement = document.getElementById('fenLibrary');
                if (fenLibraryElement) {
                    fenLibraryElement.setAttribute("style", "display:")
                }
            }
            fen = window.location.hash
            if (!fen) {
                fen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
            } else {
                fen = fen.replace(/%20/g, ' ').substring(1)
            }
            fenUI = window.document.getElementById("fen")
            if (fenUI) {
                fenUI.value = fen
            }
        }

        function toggleConsole() {
            const consoleElement = document.querySelector('.console');
            const toggleElement = document.getElementById('consoleToggle');
            const isCollapsed = consoleElement.classList.toggle('collapsed');
            toggleElement.setAttribute('aria-expanded', String(!isCollapsed));
        }
    </script>
</head>

<body class="body">
<div class="main">
    <main></main>
    <div class="console collapsed phase-start">
        <form onsubmit="handleSubmit(event)">
	            <div class="console-header">
	                <div class="control-row">
	                    <div class="primary-control-row play-controls">
		                    <button class="icon-button" onclick="resignGame(); return false" type="button"
		                            aria-label="Resign">
		                        <svg class="mode-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
		                             stroke-width="1.5" stroke="currentColor" aria-hidden="true">
		                            <path stroke-linecap="round" stroke-linejoin="round"
		                                  d="M3 3v18m0-16.5h11.25a2.25 2.25 0 0 1 1.591.659l1.5 1.5a2.25 2.25 0 0 0 1.591.659H21v9h-2.068a2.25 2.25 0 0 1-1.591-.659l-1.5-1.5a2.25 2.25 0 0 0-1.591-.659H3"/>
		                        </svg>
		                        <span class="visually-hidden">Resign</span>
		                    </button>
		                    <button id="undoButton" class="icon-button" onclick="undoLastMove(); return false" type="button"
		                            aria-label="Undo move">
		                        <svg class="mode-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
		                             stroke-width="1.5" stroke="currentColor" aria-hidden="true">
		                            <path stroke-linecap="round" stroke-linejoin="round"
		                                  d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/>
		                        </svg>
		                        <span class="visually-hidden">Undo</span>
		                    </button>
	                    </div>
	                    <div class="mode-control-row start-controls">
	                        <button class="computer-mode-button icon-button active" data-mode="white"
	                                onclick="setComputerMode('white'); return false" type="button" aria-label="White">
	                            <span class="king-icon white-king-icon" aria-hidden="true"></span>
	                            <span class="visually-hidden">White</span>
	                        </button>
	                        <button class="computer-mode-button icon-button" data-mode="black"
	                                onclick="setComputerMode('black'); return false" type="button" aria-label="Black">
	                            <span class="king-icon black-king-icon" aria-hidden="true"></span>
	                            <span class="visually-hidden">Black</span>
	                        </button>
	                        <button class="computer-mode-button icon-button" data-mode="random"
	                                onclick="setComputerMode('random'); return false" type="button" aria-label="Random">
	                            <span class="split-king-icon" aria-hidden="true">
	                                <span class="split-king-half split-king-left">
	                                    <span class="king-icon white-king-icon"></span>
	                                </span>
	                                <span class="split-king-half split-king-right">
	                                    <span class="king-icon black-king-icon"></span>
	                                </span>
		                            </span>
		                            <span class="visually-hidden">Random</span>
		                        </button>
		                        <button class="computer-mode-button icon-button" data-mode="human"
		                                onclick="setComputerMode('human'); return false" type="button"
		                                aria-label="Human vs. human">
		                            <svg class="mode-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
		                                 viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
		                                 aria-hidden="true">
		                                <path stroke-linecap="round" stroke-linejoin="round"
		                                      d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0"/>
		                            </svg>
		                            <span class="visually-hidden">Human vs. human</span>
		                        </button>
		                        <button class="computer-mode-button icon-button" data-mode="ai-vs-ai"
		                                onclick="setComputerMode('ai-vs-ai'); return false" type="button"
		                                aria-label="AI vs. AI">
		                            <svg class="mode-icon ai-mode-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
		                                 viewBox="0 0 48 24"
		                                 stroke-width="1.5" stroke="currentColor" aria-hidden="true">
		                                <path stroke-linecap="round" stroke-linejoin="round"
		                                      d="M12 3v2M4 11H2m20 0h-2M7 7h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm3 4h.01M14 11h.01M10 15h4M36 3v2m-8 6h-2m20 0h-2M31 7h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H31a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm3 4h.01M38 11h.01M34 15h4"/>
		                            </svg>
	                            <span class="visually-hidden">AI vs. AI</span>
	                        </button>
	                        <select id="aiStrength" onchange="updateAiStrength(this.value)" aria-label="AI strength">
	                            <option value="beginner">Beginner</option>
	                            <option value="casual">Casual</option>
	                            <option value="club" selected>Club</option>
	                            <option value="strong">Strong</option>
	                            <option value="analysis">Analysis</option>
	                        </select>
	                    </div>
	                </div>
	                <button
                        id="consoleToggle"
                        class="console-toggle"
                        onclick="toggleConsole(); return false"
                        type="button"
                        aria-label="Toggle console"
                        aria-expanded="false"
                        aria-controls="consoleBody"
                >
                    <svg class="chevron-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                    </svg>
                    <svg class="chevron-up" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5"/>
                    </svg>
                </button>
            </div>
            <div id="consoleBody" class="console-body">
                <div class="fen-row">
                    <button type="submit">FEN</button>
                    <input id="fen" class="full-width-input" value=""/>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
